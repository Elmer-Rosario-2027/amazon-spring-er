apiVersion: apps/v1
kind: Deployment
metadata:
  name: elmerrosarioamazonspringer
  namespace: rosario-azure-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elmerrosarioamazonspringer
  template:
    metadata:
      labels:
        app: elmerrosarioamazonspringer
    spec:
      containers:
        - name: elmerrosarioamazonspringer
          image: rosarioazureecr.azurecr.io/elmerrosarioamazonspringer:latest
          ports:
            - containerPort: 8080
      imagePullSecrets:
        - name: rosarioazureecr1906-auth